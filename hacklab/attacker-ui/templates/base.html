<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HackLab — {% block title %}攻撃者コンソール{% endblock %}</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --green: #39d353;
      --cyan: #58a6ff;
      --red: #f85149;
      --yellow: #d29922;
      --text: #c9d1d9;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
    }
    /* ナビゲーション */
    nav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 2rem;
    }
    nav .logo {
      color: var(--green); font-size: 1.2rem; font-weight: bold; text-decoration: none;
    }
    nav a {
      color: var(--muted); text-decoration: none; font-size: 0.9rem;
      padding: 0.3rem 0.6rem; border-radius: 4px; transition: all 0.2s;
    }
    nav a:hover, nav a.active { color: var(--text); background: var(--border); }
    nav .score-badge {
      margin-left: auto; background: var(--green); color: #000;
      padding: 0.2rem 0.7rem; border-radius: 999px; font-size: 0.8rem; font-weight: bold;
    }
    /* メインレイアウト */
    main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    h1 { color: var(--green); margin-bottom: 0.5rem; }
    h2 { color: var(--cyan); margin: 1.5rem 0 0.75rem; font-size: 1.1rem; }
    p.subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
    /* カード */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem;
    }
    .card h3 { color: var(--cyan); margin-bottom: 0.75rem; font-size: 1rem; }
    /* フォーム部品 */
    input, select, textarea {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 0.5rem 0.75rem; border-radius: 4px;
      font-family: inherit; font-size: 0.9rem; width: 100%;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--cyan); }
    label { display: block; margin-bottom: 0.25rem; color: var(--muted); font-size: 0.85rem; }
    .form-group { margin-bottom: 0.75rem; }
    /* ボタン */
    .btn {
      background: var(--green); color: #000; border: none; padding: 0.5rem 1.2rem;
      border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold;
      font-size: 0.9rem; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-cyan { background: var(--cyan); color: #000; }
    .btn-hint { background: var(--yellow); color: #000; font-size: 0.8rem; padding: 0.3rem 0.7rem; }
    /* ターミナル出力 */
    .terminal {
      background: #000; border: 1px solid var(--border); border-radius: 4px;
      padding: 1rem; min-height: 120px; max-height: 400px; overflow-y: auto;
      font-size: 0.85rem; white-space: pre-wrap; word-break: break-all;
      color: var(--green); margin-top: 0.75rem;
    }
    .terminal .err { color: var(--red); }
    .terminal .info { color: var(--cyan); }
    .terminal .flag { color: var(--yellow); font-weight: bold; }
    /* フラグバッジ */
    .flag-badge {
      display: inline-block; background: var(--yellow); color: #000;
      padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem;
      font-weight: bold; margin: 0.25rem;
    }
    /* ステージカード */
    .stage-card {
      border-left: 3px solid var(--border); padding-left: 1rem; margin-bottom: 1.5rem;
    }
    .stage-card.done { border-left-color: var(--green); }
    .stage-card.active { border-left-color: var(--cyan); }
    .stage-num { color: var(--muted); font-size: 0.8rem; }
    .stage-title { font-size: 1rem; margin: 0.25rem 0; }
    /* グリッド */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    /* ヒントボックス */
    .hint-box {
      background: #2d2201; border: 1px solid var(--yellow); border-radius: 4px;
      padding: 0.75rem; margin-top: 0.5rem; font-size: 0.85rem; color: var(--yellow);
      display: none;
    }
    .hint-box.show { display: block; }
    /* ローダー */
    .spinner { display: none; color: var(--muted); font-size: 0.85rem; }
    .spinner.show { display: inline; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">⚡ HackLab</a>
    <a href="/" {% if request.path == '/' %}class="active"{% endif %}>ダッシュボード</a>
    <a href="/recon" {% if request.path == '/recon' %}class="active"{% endif %}>偵察</a>
    <a href="/exploit" {% if request.path == '/exploit' %}class="active"{% endif %}>侵入</a>
    <a href="/flags" {% if request.path == '/flags' %}class="active"{% endif %}>フラグ</a>
    <span class="score-badge" id="nav-score">読み込み中...</span>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // スコアをナビに反映
    async function updateScore() {
      const r = await fetch('/flags');
      // フラグページは HTML なので /api/flag は POST のみ
      // 代わりにダッシュボードの score を取得
    }

    // ターミナル出力ヘルパー
    function termPrint(el, text, cls = '') {
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = text + '\n';
      el.appendChild(span);
      el.scrollTop = el.scrollHeight;
    }

    function termClear(el) { el.innerHTML = ''; }

    // フラグ自動検出
    async function autoDetectFlag(text, terminal) {
      const r = await fetch('/api/check_flag', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text})
      });
      const d = await r.json();
      if (d.found && d.found.length > 0) {
        d.found.forEach(f => {
          termPrint(terminal, `\n🚩 FLAG 取得! ${f.flag}`, 'flag');
          termPrint(terminal, `   ステージ: ${f.stage}`, 'info');
        });
        updateNavScore();
      }
    }

    async function updateNavScore() {
      try {
        const r = await fetch('/api/nav_score');
        if (r.ok) {
          const d = await r.json();
          document.getElementById('nav-score').textContent = `🚩 ${d.score}/${d.total}`;
        }
      } catch {}
    }

    updateNavScore();
    setInterval(updateNavScore, 5000);

    // ヒントボタン
    document.querySelectorAll('.btn-hint').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.hint);
        if (target) target.classList.toggle('show');
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
