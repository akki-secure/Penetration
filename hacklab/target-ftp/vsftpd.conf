# vsftpd 設定 — 匿名ログイン許可 (やられアプリ用)

# 【脆弱性】匿名ログインを有効化: anonymous / (パスワードなし) でアクセス可
anonymous_enable=YES
local_enable=NO
write_enable=NO
anon_root=/var/ftp

# ディレクトリ一覧を許可
dirmessage_enable=YES
xferlog_enable=YES

# バナー: バージョン情報を露出 (偵察で取得可能)
ftpd_banner=vsftpd 3.0.5 - HackLab FTP Server Ready

# パッシブモード設定 (Docker コンテナ内で動作させるため)
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=172.20.0.20

listen=YES
listen_ipv6=NO
