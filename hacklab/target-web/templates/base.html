<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TechNova Solutions{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; display: flex; flex-direction: column; }

    /* Nav */
    nav { background: #003366; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 60px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .nav-brand { color: #fff; font-size: 1.3rem; font-weight: 700; letter-spacing: 0.05em; text-decoration: none; }
    .nav-brand span { color: #66b2ff; }
    .nav-links { display: flex; gap: 8px; align-items: center; }
    .nav-links a { color: #cce0ff; text-decoration: none; font-size: 0.875rem; padding: 6px 14px; border-radius: 4px; transition: background 0.2s; }
    .nav-links a:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .nav-links a.btn-primary { background: #0055a5; color: #fff; }
    .nav-links a.btn-primary:hover { background: #0066cc; }

    /* Main content */
    main { flex: 1; }

    /* Hero */
    .hero { background: linear-gradient(135deg, #003366 0%, #0055a5 100%); color: #fff; padding: 80px 40px; text-align: center; }
    .hero h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 16px; line-height: 1.4; }
    .hero p { font-size: 1.1rem; opacity: 0.85; margin-bottom: 32px; }
    .btn { display: inline-block; padding: 12px 32px; border-radius: 6px; font-size: 1rem; font-weight: 600; text-decoration: none; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-white { background: #fff; color: #003366; }
    .btn-white:hover { background: #e8f0fe; }
    .btn-blue { background: #0055a5; color: #fff; }
    .btn-blue:hover { background: #0066cc; }

    /* Cards */
    .section { padding: 60px 40px; max-width: 1100px; margin: 0 auto; width: 100%; }
    .section-title { font-size: 1.5rem; font-weight: 700; color: #003366; margin-bottom: 32px; padding-bottom: 12px; border-bottom: 3px solid #0055a5; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .card { background: #fff; border-radius: 10px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-top: 4px solid #0055a5; }
    .card-icon { font-size: 2rem; margin-bottom: 12px; }
    .card h3 { font-size: 1.1rem; color: #003366; margin-bottom: 8px; }
    .card p { font-size: 0.9rem; color: #666; line-height: 1.6; }

    /* Form */
    .form-card { background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); max-width: 440px; margin: 60px auto; }
    .form-card h2 { font-size: 1.4rem; color: #003366; margin-bottom: 8px; }
    .form-card .subtitle { font-size: 0.875rem; color: #888; margin-bottom: 28px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 600; color: #444; margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #cdd5df; border-radius: 6px; font-size: 0.95rem; color: #333; outline: none; transition: border 0.2s; font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus { border-color: #0055a5; box-shadow: 0 0 0 3px rgba(0,85,165,0.1); }
    .form-btn { width: 100%; padding: 12px; background: #0055a5; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: inherit; }
    .form-btn:hover { background: #0066cc; }
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem; }
    .alert-error { background: #fff0f0; color: #c00; border: 1px solid #fcc; }
    .alert-success { background: #f0fff4; color: #0a6e2a; border: 1px solid #b2f2bb; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table th { background: #003366; color: #fff; padding: 12px 16px; text-align: left; font-weight: 600; }
    table td { padding: 11px 16px; border-bottom: 1px solid #e8ecf0; color: #444; }
    table tr:hover td { background: #f0f5ff; }

    /* Badge */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
    .badge-admin { background: #fce8e8; color: #c00; }
    .badge-user { background: #e8f0fe; color: #0055a5; }

    /* Portal dashboard */
    .portal-header { background: #003366; color: #fff; padding: 32px 40px; }
    .portal-header h1 { font-size: 1.5rem; font-weight: 700; }
    .portal-header p { opacity: 0.8; font-size: 0.9rem; margin-top: 4px; }
    .portal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 28px; }
    .portal-card { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); text-decoration: none; color: inherit; border-left: 4px solid #0055a5; transition: box-shadow 0.2s, transform 0.2s; }
    .portal-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.12); transform: translateY(-2px); }
    .portal-card .card-label { font-size: 0.8rem; color: #888; margin-bottom: 6px; }
    .portal-card .card-title { font-size: 1.05rem; font-weight: 700; color: #003366; }
    .portal-card .card-desc { font-size: 0.85rem; color: #666; margin-top: 4px; }
    .notice-list { list-style: none; }
    .notice-list li { padding: 14px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .notice-list li span.date { color: #888; font-size: 0.8rem; margin-right: 12px; }
    .notice-list li span.tag { background: #e8f0fe; color: #0055a5; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; margin-right: 8px; }

    /* Footer */
    footer { background: #001f40; color: #88a8cc; text-align: center; padding: 20px 40px; font-size: 0.8rem; margin-top: auto; }
    footer a { color: #88a8cc; text-decoration: none; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="/"><span>Tech</span>Nova Solutions</a>
    <div class="nav-links">
      <a href="/">ホーム</a>
      <a href="/#services">サービス</a>
      <a href="/#news" onclick="window.location='/#contact';return false;">ニュース</a>
      <a href="/#contact">会社情報</a>
      <a href="/#contact">お問い合わせ</a>
      {% if session.get('user') %}
        <a href="/dashboard">社員ポータル</a>
        <a href="/logout" class="btn-primary">ログアウト</a>
      {% else %}
        <a href="/login" class="btn-primary">社員ログイン</a>
      {% endif %}
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>&copy; 2024 TechNova Solutions Inc. All rights reserved. &nbsp;|&nbsp;
      <a href="/privacy">プライバシーポリシー</a> &nbsp;|&nbsp;
      <a href="/sitemap">サイトマップ</a>
    </p>
  </footer>
</body>
</html>
