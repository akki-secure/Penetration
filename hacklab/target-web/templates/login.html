{% extends "base.html" %}
{% block title %}社員ポータル ログイン — TechNova Solutions{% endblock %}

{% block content %}
<div style="background: linear-gradient(135deg, #003366 0%, #0055a5 100%); min-height: calc(100vh - 100px); display:flex; align-items:center; justify-content:center; padding: 40px 20px;">
  <div class="form-card" style="width:100%;max-width:420px;">
    <div style="text-align:center; margin-bottom:28px;">
      <div style="font-size:2.5rem; margin-bottom:8px;">🔐</div>
      <h2 style="color:#003366;font-size:1.4rem;">社員ポータル</h2>
      <p class="subtitle">TechNova Solutions 従業員専用</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" name="username" placeholder="例: tanaka.taro" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" placeholder="パスワードを入力" autocomplete="current-password" required>
      </div>
      <button type="submit" class="form-btn">ログイン</button>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:0.85rem; color:#888;">
      パスワードを忘れた方は <a href="/support" style="color:#0055a5;">IT サポートデスク</a> までご連絡ください。
    </p>
  </div>
</div>
{% endblock %}
